<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vessel - Python Sandbox</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0B0D11;
      color: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }
    .card {
      background: #12151B;
      border: 1px solid #232936;
      border-radius: 1rem;
      padding: 2.5rem;
      max-width: 520px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 { color: #E73F1E; margin-top: 0; font-size: 1.85rem; font-weight: 800; }
    p { color: #94A3B8; line-height: 1.6; font-size: 0.95rem; }
    .badge {
      display: inline-block;
      background: rgba(231, 63, 30, 0.15);
      border: 1px solid rgba(231, 63, 30, 0.3);
      color: #E73F1E;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }
    code {
      background: #181C24;
      color: #E73F1E;
      padding: 0.2rem 0.45rem;
      border-radius: 0.375rem;
      font-size: 0.9em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .footer {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid #232936;
      font-size: 0.8rem;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Python Sandbox</span>
    <h1>Welcome to Vessel!</h1>
    <p>Your Python web preview is live and serving traffic on port <code>3000</code>.</p>
    <p>Edit <code>main.py</code> or <code>index.html</code> in the code editor to customize your app.</p>
    <div class="footer">
      Vessel In-Browser Cloud IDE & Sandbox
    </div>
  </div>
</body>
</html>
